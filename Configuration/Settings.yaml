UpAssist:
  Neos:
    GoogleReviews:
      # 'legacy' = maps.googleapis.com (widely enabled, query-string auth)
      # 'new'    = places.googleapis.com/v1 (requires separate enablement, header auth)
      apiVersion: 'legacy'
      apiKey: ''
      defaultPlaceId: ''
      cacheLifetime: 86400
      maxReviews: 5
      language: 'nl'

Neos:
  Neos:
    userInterface:
      translation:
        autoInclude:
          UpAssist.Neos.GoogleReviews:
            - '*'
    fusion:
      autoInclude:
        UpAssist.Neos.GoogleReviews: true
  Fusion:
    defaultContext:
      GoogleReviews: UpAssist\Neos\GoogleReviews\Eel\GoogleReviewsHelper
